<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="放送大学Media">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>放送大学 メディア</title>
<style>
:root{--bg:#f7f8fa;--panel:#ffffff;--panel2:#eef2f7;--text:#111827;--muted:#667085;--line:#d9dee7;--blue:#2563eb;--red:#dc2626;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic UI",sans-serif}
body{min-height:100dvh;padding-bottom:calc(76px + var(--safe-b))}
button,input,select{font:inherit}.top{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fffffff2;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-weight:900}.title{font-weight:800;white-space:nowrap}
.spacer{flex:1}.iconbtn{border:0;background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 10px}.install{display:none;background:var(--blue);font-size:12px;font-weight:800}
.page{padding:12px;max-width:760px;margin:auto}.search{position:sticky;top:66px;z-index:20;background:var(--bg);padding-bottom:8px}
.search input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-size:16px;outline:none}
.chips{display:flex;gap:7px;overflow:auto;padding:9px 0 3px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 10px;border-radius:999px;font-size:13px}.chip.on{background:#e8ecff;color:#111827;border-color:#e8ecff}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:13px 2px 10px}.sectionhead h2{font-size:18px;margin:0}.count{font-size:12px;color:var(--muted)}
.feed{display:grid;gap:14px}.card{border:0;background:transparent;color:inherit;text-align:left;padding:0;cursor:pointer}.thumb{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#eef4ff,#dbe7ff);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.thumb .play{width:52px;height:52px;border-radius:50%;background:#2563eb;display:grid;place-items:center;font-size:23px;padding-left:3px;color:#fff}
.thumb .media{position:absolute;left:9px;top:9px;background:#ffffffea;color:#1f2937;border:1px solid #d9dee7;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:800}.thumb .extent{position:absolute;right:9px;bottom:9px;background:#ffffffea;color:#1f2937;border:1px solid #d9dee7;padding:4px 7px;border-radius:5px;font-size:11px}
.cardbody{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:9px 2px 0}.avatar{width:40px;height:40px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:800}.ctitle{font-size:15px;font-weight:800;line-height:1.45}.meta{font-size:12px;color:var(--muted);margin-top:3px}.star{border:0;background:none;color:#9ca3af;font-size:23px;padding:0 4px}.star.on{color:#facc15}
.bottom{position:fixed;z-index:40;left:0;right:0;bottom:0;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);background:#fffffff5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);backdrop-filter:blur(18px)}
.nav{border:0;background:transparent;color:var(--muted);font-size:11px;display:grid;place-items:center;align-content:center;gap:2px}.nav b{font-size:20px;line-height:1}.nav.on{color:var(--blue)}
.hidden{display:none!important}.empty{padding:50px 12px;text-align:center;color:var(--muted)}
/* watch */
.watch{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}.watchtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;padding:8px;background:#fffffff2;border-bottom:1px solid var(--line)}.watchtop button{border:0;background:transparent;color:var(--text);font-size:25px;padding:8px}.watchtop strong{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player{background:#000;aspect-ratio:16/9;position:relative;display:grid;place-items:center}.player iframe{width:100%;height:100%;border:0}.playerStart{text-align:center;padding:20px}.playerStart .big{display:inline-grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--blue);font-size:31px;border:0;color:#fff;padding-left:5px}.playerStart p{font-size:12px;color:#d1d5db;max-width:330px}
.watchinfo{padding:15px}.watchinfo h1{font-size:20px;line-height:1.45;margin:0 0 7px}.watchmeta{color:var(--muted);font-size:13px}.watchactions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.watchactions button{border:1px solid var(--line);text-decoration:none;text-align:center;background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 7px;font-size:12px;font-weight:700}.notice{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;color:var(--muted);line-height:1.6}
.offline{display:none;font-size:11px;background:#fee2e2;color:#991b1b;padding:5px 8px;border-radius:8px}.offline.on{display:block}
@media(min-width:700px){.feed{grid-template-columns:1fr 1fr}.watch{left:50%;transform:translateX(-50%);max-width:760px;box-shadow:0 0 0 100vw #0008}}

/* Official-course-first design (v19) */
.card{position:relative;content-visibility:auto;contain-intrinsic-size:330px 380px}
.thumb{touch-action:manipulation}
.thumb .play{font-size:25px;padding-left:0;font-weight:800;box-shadow:0 4px 16px #174ea62c}
.watch{overscroll-behavior:contain}
.watchtop{min-height:60px;gap:4px}
.watchtop strong{font-size:15px}
.watchinfo{max-width:760px;margin:auto;padding:20px 16px 42px}
.watchinfo h1{font-size:22px;line-height:1.48;margin:18px 0 8px;letter-spacing:.015em}
.watchmeta{font-size:13px;line-height:1.65}
.officialHero{position:relative;overflow:hidden;border:1px solid #bbcef6;border-radius:22px;background:linear-gradient(126deg,#174ea6 0%,#2563eb 58%,#477bef 100%);color:#fff;min-height:148px;padding:24px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.officialHero:after{content:"↗";position:absolute;right:-3px;top:-48px;font-size:190px;line-height:1;color:#ffffff18;pointer-events:none}
.officialHeroTag{font-size:12px;font-weight:750;letter-spacing:.08em}
.officialHeroTitle{font-size:24px;font-weight:850;letter-spacing:.02em}
.officialMain{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:20px;box-shadow:0 2px 7px #142f5b0a}
.officialLabel{font-size:13px;font-weight:800;margin-bottom:12px;color:#344054}
.officialOpen{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:14px 16px;border-radius:13px;background:#205ee4;color:#fff;text-decoration:none;font-size:16px;font-weight:850;text-align:center;line-height:1.35}
.officialOpen .externalIcon{font-size:20px}
.officialOpen:hover{background:#164cbe}
.officialOpen:focus-visible,.watchactions a:focus-visible,.watchactions button:focus-visible{outline:3px solid #ffb547;outline-offset:3px}
.officialHelp{font-size:12px;line-height:1.7;color:var(--muted);margin:12px 1px 1px}
.directOpen{display:block;width:max-content;max-width:100%;font-size:12px;color:#205ee4;margin:13px auto 0;text-decoration:underline;text-underline-offset:3px;line-height:1.6;text-align:center}
.directOpen:focus-visible{outline:3px solid #ffb547;outline-offset:3px}
.progressSection{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.progressHead{font-weight:800;font-size:15px;margin-bottom:8px}
.progressDescription{font-size:13px;line-height:1.7;color:var(--muted)}
.episodePanel{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin-top:12px}
.episodePanel label{font-size:13px;font-weight:750}
.episodePanel select{border-radius:10px;background:var(--panel2);border:1px solid var(--line);padding:10px;font-size:14px;color:var(--text);min-width:112px}
.fastHint{color:var(--muted);font-size:12px;line-height:1.65;margin:10px 0 0}
.watchactions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.watchactions button,.watchactions a{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 8px;background:var(--panel);color:var(--text);font-size:13px;font-weight:750;text-decoration:none;text-align:center}
.enrolledContinue{min-height:40px}
@media(min-width:700px){.feed{grid-template-columns:1fr 1fr}.watch{left:50%;transform:translateX(-50%);max-width:760px;box-shadow:0 0 0 100vw #0008}}

/* enrolled courses */
.card{position:relative}
.enrolledSection{margin:4px 0 18px}
.enrolledHead{display:flex;align-items:end;justify-content:space-between;margin:4px 2px 9px}
.enrolledHead h2{font-size:19px;margin:0}
.enrolledHead span{font-size:12px;color:var(--muted)}
.enrolledRail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,78%);gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 1px 8px;scrollbar-width:none}
.enrolledRail::-webkit-scrollbar{display:none}
.enrolledCard{scroll-snap-align:start;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;padding:13px;text-align:left;min-height:116px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px #1018280a;cursor:pointer}
.enrolledCard:active{transform:scale(.99)}
.enrolledBadge{display:inline-flex;align-items:center;width:max-content;gap:5px;background:#eaf1ff;color:#174ea6;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.enrolledTitle{font-size:15px;font-weight:850;line-height:1.42}
.enrolledMeta{margin-top:auto;color:var(--muted);font-size:11px}
.enrolledMissing .enrolledBadge{background:#f2f4f7;color:#475467}
.enrolledMark{position:absolute;left:9px;bottom:9px;background:#eaf1ffff;color:#174ea6;border:1px solid #cbdcff;padding:4px 7px;border-radius:6px;font-size:11px;font-weight:800}
@media(min-width:600px){.enrolledRail{grid-auto-columns:minmax(240px,42%)}}

/* enrolled progress */
.enrolledStatus{font-size:12px;color:var(--muted);line-height:1.5}
.enrolledActions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:2px}
.enrolledContinue{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:9px 10px;font-size:12px;font-weight:800}
.enrolledSelect{max-width:112px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);padding:8px 7px;font-size:12px}
.progressConfirm{position:fixed;z-index:90;left:12px;right:12px;bottom:calc(76px + var(--safe-b));max-width:720px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px #1018282b;padding:13px}
.progressConfirmText{font-size:13px;font-weight:750;line-height:1.45;margin-bottom:10px}
.progressConfirmActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.progressConfirmActions button{border-radius:10px;padding:10px;border:1px solid var(--line);font-weight:800;background:#fff;color:var(--text)}
.progressConfirmActions .done{border-color:var(--blue);background:var(--blue);color:#fff}
</style>
</head>
<body>
<header class="top">
 <div class="logo">OU</div><div class="title">放送大学 Media</div>
 <span id="offline" class="offline">オフライン</span><div class="spacer"></div>
 <button id="installBtn" class="iconbtn install">アプリを設置</button>
 
</header>

<main class="page">
 <section id="homeView">
  <div class="search"><input id="homeQ" type="search" placeholder="授業を検索：哲学、文学、心理、ユング…">
   <div class="chips" id="mediaChips"><button class="chip on" data-media="">すべて</button><button class="chip" data-media="テレビ">テレビ</button><button class="chip" data-media="ラジオ">ラジオ</button><button class="chip" data-extent="全15回">全15回公開</button></div>
  </div>
  <section id="enrolledSection" class="enrolledSection">
    <div class="enrolledHead"><h2>履修中</h2><span id="enrolledCount"></span></div>
    <div id="enrolledRail" class="enrolledRail"></div>
   </section>
  <div class="sectionhead"><h2 id="viewTitle">おすすめ / 新しい授業</h2><span id="count" class="count"></span></div>
  <div id="feed" class="feed"></div>
 </section>
</main>

<nav class="bottom">
 <button class="nav on" data-view="home"><b>⌂</b><span>ホーム</span></button>
 <button class="nav" data-view="search"><b>⌕</b><span>検索</span></button>
 <button class="nav" data-view="history"><b>◷</b><span>履歴</span></button>
 <button class="nav" data-view="favorites"><b>★</b><span>お気に入り</span></button>
</nav>

<div id="progressConfirm" class="progressConfirm hidden" role="dialog" aria-live="polite">
  <div id="progressConfirmText" class="progressConfirmText"></div>
  <div class="progressConfirmActions">
    <button id="progressNotYet">まだ</button>
    <button id="progressDone" class="done">見た</button>
  </div>
 </div>

<section id="watch" class="watch hidden" aria-hidden="true">
 <div class="watchtop"><button id="closeWatch" type="button" aria-label="授業一覧に戻る">‹</button><strong id="watchBarTitle"></strong></div>
 <div class="watchinfo">
  <div class="officialHero" aria-label="放送大学公式サイトで視聴">
   <span class="officialHeroTag">放送大学公式配信へのリンク</span>
   <span class="officialHeroTitle">公式配信で学ぶ</span>
  </div>
  <h1 id="watchTitle"></h1>
  <div id="watchMeta" class="watchmeta"></div>
  <div class="officialMain">
   <div class="officialLabel" id="officialLabel">放送授業のインターネット配信</div>
   <a id="officialLogin" class="directOpen" href="https://www.wakaba.ouj.ac.jp/portal/" target="_self">① 先にWAKABAへログイン（必要な場合）↗</a>
   <a id="officialOpen" class="officialOpen" href="https://v.ouj.ac.jp/view/ouj/" target="_self">
    <span id="officialOpenText">② 公式動画サイトを開く</span><span class="externalIcon" aria-hidden="true">↗</span>
   </a>
   <p id="officialHelp" class="officialHelp">公式配信サイトのMENUから科目名を検索してください。第1回以外の視聴にはWAKABAログインが必要です。視聴後は戻るボタンでこの画面に戻れます。</p>
  </div>
  <section id="progressSection" class="progressSection hidden" aria-label="視聴進捗の記録">
   <div class="progressHead" id="progressHead">視聴記録</div>
   <div class="progressDescription" id="progressDescription"></div>
   <div class="episodePanel" id="episodePanel">
    <label for="watchCompletedEpisode">最後に見た回</label>
    <select id="watchCompletedEpisode" aria-label="最後に見た回"><option value="0">未記録</option></select>
   </div>
   <p id="playHint" class="fastHint">進捗はこの端末に保存されます。</p>
  </section>
  <p class="fastHint">このアプリは非公式の科目リンク集です。ログイン情報は保存せず、WAKABAと動画は放送大学の公式サイトを利用します。</p>
  <div class="watchactions">
   <button id="watchFav" type="button">☆ お気に入り</button>
   <a href="https://www.ouj.ac.jp/help/guide/" target="_self">学生向け視聴案内 ↗</a>
  </div>
 </div>
</section>


<script src="./courses.js"></script>
<script>
window.OUJ_READY.then(()=>{
const PLAYER="https://v.ouj.ac.jp/view/ouj/";
const WAKABA="https://www.wakaba.ouj.ac.jp/portal/";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const norm=s=>(s||"").normalize("NFKC").toLowerCase().replace(/\s+/g,"");
const key=c=>c.title+"|"+c.media+"|"+c.extent;
const titleBase=s=>String(s||"").replace(/[（(]\s*['’]?\s*[0-9０-９]{2}\s*[）)]/g,"").trim();
const ENROLLED_TITLES=[
 "西洋哲学の根源",
 "世界文学の古典を読む",
 "哲学・思想を今考える",
 "文学批評への招待",
 "日本語リテラシー",
 "ヨーロッパ文学の読み方－近代篇",
 "より良い思考の技法",
 "日本語アカデミックライティング",
 "シン・ビートルズ de 英文法",
 "歴史のなかの人間",
 "英米哲学の挑戦",
 "世界文学への招待",
 "日本語リテラシー演習"
];
const enrolledBaseSet=new Set(ENROLLED_TITLES.map(norm));
const PROGRESS_KEY="ouj-enrolled-progress-v1";
let enrolledProgress={};
try{enrolledProgress=JSON.parse(localStorage.getItem(PROGRESS_KEY)||"{}")}catch(e){}
function progressId(base){return norm(base)}
function getProgress(base){return enrolledProgress[progressId(base)]||{}}
function saveProgress(){localStorage.setItem(PROGRESS_KEY,JSON.stringify(enrolledProgress))}
function patchProgress(base,patch){
  const id=progressId(base);
  enrolledProgress[id]={...(enrolledProgress[id]||{}),...patch};
  saveProgress();
}
function nextEpisode(base){
  const p=getProgress(base), last=Number(p.lastEpisode)||0;
  return last>=15?15:last+1;
}
function progressText(base){
  const p=getProgress(base), last=Number(p.lastEpisode)||0;
  if(last>=15)return "前回：第15回 ・ 全15回視聴";
  if(last>0)return "前回：第"+last+"回 ・ 続き：第"+(last+1)+"回";
  return "前回：未記録 ・ 続き：第1回";
}
function pendingProgress(){
  for(const base of ENROLLED_TITLES){
    const p=getProgress(base);
    if(Number(p.pendingEpisode)>0)return {base,episode:Number(p.pendingEpisode)};
  }
  return null;
}
function showProgressConfirm(){
  const pending=pendingProgress();
  const box=$("#progressConfirm");
  if(!box)return;
  if(!pending){box.classList.add("hidden");return}
  $("#progressConfirmText").textContent="「"+pending.base+"」第"+pending.episode+"回を見ましたか？";
  box.dataset.base=pending.base;
  box.dataset.episode=String(pending.episode);
  box.classList.remove("hidden");
}
function clearPending(base){
  patchProgress(base,{pendingEpisode:null});
  showProgressConfirm();
}
function completePending(base,episode){
  patchProgress(base,{lastEpisode:episode,pendingEpisode:null,lastCompletedAt:Date.now()});
  render();
  showProgressConfirm();
}
function courseBase(c){return norm(titleBase(c.title).replace(/―.*―$/,""))}
function isEnrolled(c){return enrolledBaseSet.has(courseBase(c))}
function findEnrolledCourse(base){
  const n=norm(base);
  return OUJ_COURSES.find(c=>courseBase(c)===n)||null;
}
const favs=new Set(JSON.parse(localStorage.getItem("ouj-favs")||"[]"));
let history=JSON.parse(localStorage.getItem("ouj-history")||"[]");
const NAV_KEY="ouj-nav-state-v1";
const defaultState={view:"home",q:"",media:"",extent:"",selected:null};
let savedNav={};
try{savedNav=JSON.parse(localStorage.getItem(NAV_KEY)||"{}")}catch(e){}
let state={...defaultState,...(savedNav.state||{}),selected:null};
const restoreWatchKey=location.hash==="#watch"&&savedNav.restoreWatch?(savedNav.selectedCourseKey||""):"";
let restorePending=!!savedNav.restorePending;
let scrollSaveTimer=null;

function getScrollAnchor(){
  const cards=[...document.querySelectorAll(".card")];
  const anchor=cards.find(el=>el.getBoundingClientRect().bottom>72);
  if(!anchor)return null;
  return {key:anchor.dataset.key,top:anchor.getBoundingClientRect().top};
}
function saveNavState(markReturn=false){
  const watchOpen=!$("#watch").classList.contains("hidden")&&location.hash==="#watch";
  const payload={
    state:{view:state.view,q:state.q,media:state.media,extent:state.extent},
    selectedCourseKey:state.selected?key(state.selected):(savedNav.selectedCourseKey||null),
    restoreWatch:markReturn||watchOpen,
    scrollY:window.scrollY||0,
    anchor:getScrollAnchor(),
    restorePending:markReturn||restorePending,
    savedAt:Date.now()
  };
  localStorage.setItem(NAV_KEY,JSON.stringify(payload));
  savedNav=payload;
  restorePending=payload.restorePending;
}
function syncControls(){
  $("#homeQ").value=state.q||"";
  $$(".nav").forEach(n=>n.classList.toggle("on",n.dataset.view===state.view || (state.view==="search"&&n.dataset.view==="search")));
  $$("[data-media]").forEach(ch=>ch.classList.toggle("on",(ch.dataset.media||"")===(state.media||"")));
  const extentChip=$('[data-extent="全15回"]');
  if(extentChip)extentChip.classList.toggle("on",state.extent==="全15回");
}
function restoreScrollPosition(force=false){
  let snap={};
  try{snap=JSON.parse(localStorage.getItem(NAV_KEY)||"{}")}catch(e){}
  if(!force && !snap.restorePending)return;
  const doRestore=()=>{
    let y=Number(snap.scrollY)||0;
    if(snap.anchor&&snap.anchor.key){
      const el=[...document.querySelectorAll(".card")].find(x=>x.dataset.key===snap.anchor.key);
      if(el){
        const pageTop=el.getBoundingClientRect().top+(window.scrollY||0);
        y=Math.max(0,pageTop-(Number(snap.anchor.top)||0));
      }
    }
    window.scrollTo(0,y);
    snap.restorePending=false;
    localStorage.setItem(NAV_KEY,JSON.stringify(snap));
    restorePending=false;
  };
  requestAnimationFrame(()=>requestAnimationFrame(doRestore));
}

function saveFavs(){localStorage.setItem("ouj-favs",JSON.stringify([...favs]))}
function saveHistory(){localStorage.setItem("ouj-history",JSON.stringify(history.slice(0,50)))}
function addHistory(c){
 history=history.filter(x=>x.key!==key(c));
 history.unshift({key:key(c),title:c.title,media:c.media,extent:c.extent,category:c.category,year:c.year,at:Date.now()});
 saveHistory();
}
function card(c){
 const art=document.createElement("article"); art.className="card"; art.dataset.key=key(c);
 art.innerHTML=`<div class="thumb"><span class="media">${c.media}</span><span class="play" aria-hidden="true">↗</span><span class="extent">${c.extent}</span></div>
 ${isEnrolled(c)?`<span class="enrolledMark">履修中</span>`:""}<div class="cardbody"><div class="avatar">${c.media==="テレビ"?"TV":"RAD"}</div><div><div class="ctitle"></div><div class="meta">${c.category}${c.year?" ・ "+c.year+"年度":""}</div></div><button class="star ${favs.has(key(c))?"on":""}" aria-label="お気に入り">${favs.has(key(c))?"★":"☆"}</button></div>`;
 art.querySelector(".ctitle").textContent=c.title;
 art.onclick=e=>{if(!e.target.closest(".star"))launchOfficial(c)};
 art.setAttribute("role","button");
 art.setAttribute("tabindex","0");
 art.setAttribute("aria-label",c.title+" の詳細を開く");
 art.onkeydown=e=>{if(e.target===art&&(e.key==="Enter"||e.key===" ")){e.preventDefault();launchOfficial(c)}};
 art.querySelector(".star").onclick=e=>{e.stopPropagation(); toggleFav(c); render()};
 return art;
}
function renderEnrolled(){
 const section=$("#enrolledSection"), rail=$("#enrolledRail");
 if(!section||!rail)return;
 const show=state.view==="home"&&!state.q&&!state.media&&!state.extent;
 section.classList.toggle("hidden",!show);
 if(!show)return;
 rail.innerHTML="";
 $("#enrolledCount").textContent=ENROLLED_TITLES.length+"科目";
 ENROLLED_TITLES.forEach(base=>{
   const c=findEnrolledCourse(base);
   const exactTitle=c?c.title:base;
   const direct=!!(c&&window.OUJ_LINKS&&window.OUJ_LINKS[c.title]);
   const p=getProgress(base), next=nextEpisode(base);
   const card=document.createElement("article");
   card.className="enrolledCard"+(c?"":" enrolledMissing");
   card.innerHTML=`<span class="enrolledBadge">● 履修中</span>
     <span class="enrolledTitle"></span>
     <span class="enrolledStatus"></span>
     <span class="enrolledMeta">${c?[c.media,c.extent].filter(Boolean).join(" ・ "):"公開OCW未掲載"}${direct?" ・ OCW":""}</span>
     <div class="enrolledActions">
       <button class="enrolledContinue"></button>
       <select class="enrolledSelect" aria-label="最後に見た回を記録"></select>
     </div>`;
   card.querySelector(".enrolledTitle").textContent=exactTitle;
   card.querySelector(".enrolledStatus").textContent=progressText(base);
   const go=card.querySelector(".enrolledContinue");
   go.textContent=!c?"公開OCW未掲載":(Number(p.lastEpisode)>=15?"科目ページを開く ↗":"科目を開く（次：第"+next+"回）");
   go.disabled=!c;
   const sel=card.querySelector(".enrolledSelect");
   sel.innerHTML='<option value="">前回を記録</option>'+Array.from({length:15},(_,i)=>`<option value="${i+1}">第${i+1}回</option>`).join("");
   if(Number(p.lastEpisode)>0)sel.value=String(p.lastEpisode);
   sel.onchange=()=>{
     if(!sel.value)return;
     patchProgress(base,{lastEpisode:Number(sel.value),pendingEpisode:null,lastCompletedAt:Date.now()});
     render();
   };
   go.onclick=()=>{if(c)launchOfficial(c)};
   rail.appendChild(card);
 });
}
function sourceList(){
 if(state.view==="history"){
   return history.map(h=>OUJ_COURSES.find(c=>key(c)===h.key)).filter(Boolean);
 }
 if(state.view==="favorites") return OUJ_COURSES.filter(c=>favs.has(key(c)));
 let xs=[...OUJ_COURSES];
 if(state.q){const terms=norm(state.q).split(/[、, ]+/).filter(Boolean);xs=xs.filter(c=>terms.every(t=>norm(c.title+" "+c.category).includes(t)))}
 if(state.media) xs=xs.filter(c=>c.media===state.media);
 if(state.extent) xs=xs.filter(c=>c.extent===state.extent);
 xs.sort((a,b)=>(Number(isEnrolled(b))-Number(isEnrolled(a)))||(b.year||0)-(a.year||0)||a.title.localeCompare(b.title,"ja"));
 return xs;
}
function render(){
 const all=sourceList();
 const pinnedHome=state.view==="home"&&!state.q&&!state.media&&!state.extent;
 const xs=pinnedHome?all.filter(c=>!isEnrolled(c)):all;
 renderEnrolled();
 $("#feed").innerHTML="";
 xs.slice(0,120).forEach(c=>$("#feed").appendChild(card(c)));
 $("#count").textContent=(pinnedHome?"その他 ":"")+xs.length+"件";
 $("#viewTitle").textContent=state.view==="history"?"閲覧履歴":state.view==="favorites"?"お気に入り":state.q?"検索結果":pinnedHome?"その他の授業":"おすすめ / 新しい授業";
 syncControls();
}
function toggleFav(c){const k=key(c);favs.has(k)?favs.delete(k):favs.add(k);saveFavs()}
// Course links were published in course-links.js. No direct video fetching occurs.
function updateWatchProgress(c){
 const base=titleBase(c.title);
 $("#progressDescription").textContent=progressText(base)+"。公式サイトを開いた後、視聴する回を選んでください。";
 const sel=$("#watchCompletedEpisode"), last=Number(getProgress(base).lastEpisode)||0;
 sel.innerHTML='<option value="0">未記録</option>'+Array.from({length:15},(_,i)=>'<option value="'+(i+1)+'">第'+(i+1)+'回</option>').join("");
 sel.value=String(last);
 sel.onchange=()=>{
  patchProgress(base,{lastEpisode:Number(sel.value),pendingEpisode:null,lastCompletedAt:Date.now()});
  updateWatchProgress(c);
  render();
 };
}

function launchOfficial(c){openWatch(c)}
function openWatch(c,options={}){
 const {recordHistory=true,persist=true,pushHistory=true}=options;
 state.selected=c;
 if(recordHistory)addHistory(c);
 if(persist)saveNavState(false);
 $("#watchBarTitle").textContent=c.title;
 $("#watchTitle").textContent=c.title;
 $("#watchMeta").textContent=[c.media,c.extent,c.category,c.year?c.year+"年度":""].filter(Boolean).join(" ・ ");
 $("#watchFav").textContent=(favs.has(key(c))?"★":"☆")+" お気に入り";
 const enrolled=isEnrolled(c);
 const link=$("#officialOpen");
 link.target="_self";
 link.href=PLAYER;
 $("#officialLabel").textContent="放送授業のインターネット配信";
 $("#officialOpenText").textContent="公式動画サイトを開く";
 $("#officialHelp").textContent="公式配信サイトのMENUから「"+c.title+"」を検索してください。第1回以外の視聴にはWAKABAログインが必要です。視聴後は戻るボタンでこの画面に戻れます。";
 const login=$("#officialLogin");
 login.classList.remove("hidden");
 login.href=WAKABA;
 login.target="_self";
 login.onclick=()=>saveNavState(true);
 $("#progressSection").classList.toggle("hidden",!enrolled);
 if(enrolled){
  updateWatchProgress(c);
  $("#playHint").textContent="公式配信サイトのMENUから「"+c.title+"」を検索してください。視聴後は戻るボタンでこの画面に戻れます。";
 }
 link.onclick=()=>{
  if(enrolled){
   const base=titleBase(c.title), episode=nextEpisode(base);
   patchProgress(base,{pendingEpisode:episode,lastOpenedEpisode:episode,lastOpenedAt:Date.now()});
  }
  saveNavState(true);
 };
 $("#watch").classList.remove("hidden");
 $("#watch").setAttribute("aria-hidden","false");
 document.body.style.overflow="hidden";
 if(pushHistory&&location.hash!=="#watch")window.history.pushState({oujWatch:true},"","#watch");
 render();
}
function closeWatchUI(){
 $("#watch").classList.add("hidden");
 $("#watch").setAttribute("aria-hidden","true");
 document.body.style.overflow="";
}
$("#closeWatch").onclick=()=>{closeWatchUI();if(location.hash==="#watch")window.history.back()};
$("#watchFav").onclick=()=>{
 if(state.selected){
  toggleFav(state.selected);
  $("#watchFav").textContent=(favs.has(key(state.selected))?"★":"☆")+" お気に入り";
  render();
 }
};

$("#homeQ").addEventListener("input",e=>{state.q=e.target.value;state.view="search";render();saveNavState(false)});
$$(".nav").forEach(n=>n.onclick=()=>{state.view=n.dataset.view;if(state.view==="home")state.q="";render();scrollTo(0,0);saveNavState(false)});
$$(".chip").forEach(ch=>ch.onclick=()=>{
 if(ch.dataset.media!==undefined){state.media=ch.dataset.media;$$("[data-media]").forEach(x=>x.classList.toggle("on",x===ch));}
 if(ch.dataset.extent!==undefined){state.extent=state.extent? "":ch.dataset.extent;ch.classList.toggle("on",!!state.extent)}
 render();
 saveNavState(false);
});

$("#progressDone").onclick=()=>{
  const box=$("#progressConfirm"), base=box.dataset.base, ep=Number(box.dataset.episode);
  if(base&&ep)completePending(base,ep);
};
$("#progressNotYet").onclick=()=>{
  const box=$("#progressConfirm"), base=box.dataset.base;
  if(base)clearPending(base);
};
addEventListener("popstate",()=>{if(location.hash!=="#watch")closeWatchUI()});
addEventListener("scroll",()=>{
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer=setTimeout(()=>saveNavState(false),120);
},{passive:true});
addEventListener("pagehide",()=>saveNavState(restorePending));
addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden") saveNavState(restorePending);
  else {if(restorePending) restoreScrollPosition(true); setTimeout(showProgressConfirm,180);}
});
addEventListener("pageshow",()=>{if(restorePending)restoreScrollPosition(true);setTimeout(showProgressConfirm,180)});
addEventListener("focus",()=>{if(restorePending)restoreScrollPosition(true);setTimeout(showProgressConfirm,180)});
function online(){ $("#offline").classList.toggle("on",!navigator.onLine)} addEventListener("online",online);addEventListener("offline",online);online();

let deferredPrompt=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("#installBtn").style.display="block"});
$("#installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("#installBtn").style.display="none"};
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
if(restoreWatchKey){
 const restoredCourse=OUJ_COURSES.find(c=>key(c)===restoreWatchKey);
 if(restoredCourse)openWatch(restoredCourse,{recordHistory:false,persist:false,pushHistory:false});
}
restoreScrollPosition(true);
setTimeout(showProgressConfirm,180);
});
</script>
</body></html>
